[project]
name = "mercurius"
version = "0.1.0"
description = "Automated day-trading bot: backtest -> paper -> (maybe) live. Alpaca, SPY/QQQ intraday."
requires-python = ">=3.11"
dependencies = [
    "alpaca-py>=0.33",
    "pandas>=2.1",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "APScheduler>=3.10,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]
research = [
    "yfinance>=0.2",
    "matplotlib>=3.8",
]

[project.scripts]
mercurius = "mercurius.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mercurius"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "smoke: opt-in tests that hit the live Alpaca paper API (need MERCURIUS_SMOKE=1 and keys)",
]
